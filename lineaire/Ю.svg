<svg xmlns = "http://www.w3.org/2000/svg" width = "400" height = "300">
<style>* {fill: lightblue; stroke: black; stroke-width: 6px;} .vide {fill: none;}</style>

<g>
	<polygon points = "50,50 100,50 100,250 50,250"/>
	<path
		d = "
			M 200,50 
			a 50,50 0 0 0 -50,50 v 100
			a 50,50 0 0 0 50,50 V 50
		"
	/>
	<path
		d = "
			M 300,50
			a 50,50 0 0 1 50,50 v 100
			a 50,50 0 0 1 -50,50 V 50
		"
	/>
	<polygon points = "200,50 300,50"/>
	<polygon points = "100,150 150,150"/>
	<polygon points = "200,250 300,250"/>
</g>

<g>
	<polygon points = "10,50 140,50"/>
	<polygon points = "10,250 140,250"/>
</g>

</svg>
